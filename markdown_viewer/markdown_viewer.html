<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M12 46V18h7l7 9 7-9h7v28h-7V30l-7 9-7-9v16z M44 34h5V18h5v16h5l-7.5 10z' fill='white'/%3E%3C/svg%3E">
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('mdv.settings')||'{}');var p=s.theme||'system';var d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
<style>
:root{
  --font-ui:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;
  --font-mono:"Cascadia Code","JetBrains Mono","Fira Code",Consolas,"Courier New",monospace;
  --accent:#7c5cff; --accent-2:#22d3ee; --accent-soft:rgba(124,92,255,.12);
  --grad:linear-gradient(135deg,#7c5cff 0%,#4f8bff 50%,#22d3ee 100%);
  --radius:14px; --split:50%; --gutter:40px;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626;
}
[data-theme="light"]{
  --bg:#eef0f7; --panel:#ffffff; --panel-2:#f7f8fc; --elev:#ffffff;
  --border:rgba(20,24,45,.09); --border-2:rgba(20,24,45,.16);
  --text:#1b1f33; --text-2:#3b4160; --muted:#767c98; --faint:#b4b9cd;
  --hover:rgba(20,24,45,.06); --active-line:rgba(124,92,255,.07); --selection:rgba(124,92,255,.24);
  --shadow:0 1px 2px rgba(20,24,45,.05),0 10px 30px -12px rgba(20,24,45,.16);
  --shadow-lg:0 24px 60px -12px rgba(20,24,45,.30);
  --topbar:rgba(255,255,255,.72);
  --code-bg:#f5f6fb; --inline-code:#eef0fb; --quote:#7c5cff;
  --t-h:#5b3df5; --t-list:#d9468f; --t-code:#0f766e; --t-link:#2563eb; --t-quote:#7a809b; --t-b:#11142a; --t-i:#6d28d9; --t-fence:#9aa0b8; --t-hr:#d97706; --t-table:#0891b2; --t-url:#2563eb; --t-html:#b45309;
  --hl-kw:#8b30d9; --hl-str:#0a7d4e; --hl-com:#8a90a8; --hl-num:#c2410c; --hl-fn:#2563eb; --hl-type:#b45309; --hl-attr:#0e7490; --hl-add-bg:#e6f7ec; --hl-del-bg:#fdecec;
}
[data-theme="dark"]{
  --bg:#090b12; --panel:#10131e; --panel-2:#0d1019; --elev:#171b2b;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.14);
  --text:#e7e9f3; --text-2:#c3c7da; --muted:#8a90ab; --faint:#474c6a;
  --hover:rgba(255,255,255,.06); --active-line:rgba(124,92,255,.10); --selection:rgba(124,92,255,.38);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 28px 70px -12px rgba(0,0,0,.75);
  --topbar:rgba(13,16,26,.72);
  --code-bg:#0b0e17; --inline-code:#1c2135; --quote:#9b85ff;
  --t-h:#a794ff; --t-list:#f472b6; --t-code:#5eead4; --t-link:#7cb4ff; --t-quote:#8a90ab; --t-b:#ffffff; --t-i:#c4b5fd; --t-fence:#5b6285; --t-hr:#fbbf24; --t-table:#22d3ee; --t-url:#7cb4ff; --t-html:#fdba74;
  --hl-kw:#c792ea; --hl-str:#a5e396; --hl-com:#666d90; --hl-num:#ffb86b; --hl-fn:#82aaff; --hl-type:#ffcb6b; --hl-attr:#89ddff; --hl-add-bg:rgba(34,197,94,.14); --hl-del-bg:rgba(239,68,68,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%}
body::before{top:-25%;right:-10%;width:60vw;height:60vw;background:radial-gradient(closest-side,rgba(124,92,255,.18),transparent 70%)}
body::after{bottom:-30%;left:-15%;width:55vw;height:55vw;background:radial-gradient(closest-side,rgba(34,211,238,.13),transparent 70%)}
button{font:inherit;color:inherit}
::selection{background:var(--selection)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
::-webkit-scrollbar-track{background:transparent}
.app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:4px;padding:9px 14px;background:var(--topbar);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--border);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;margin-right:10px;user-select:none}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(124,92,255,.75);position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,85%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.logo svg{width:22px;height:22px;color:#fff}
.brand-name{font-weight:750;font-size:15px;letter-spacing:-.01em;line-height:1.15}
.brand-name span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-name small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.sep{width:1px;height:22px;background:var(--border-2);margin:0 6px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);transition:background .15s,color .15s,transform .1s,box-shadow .2s,filter .2s;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px -8px rgba(79,139,255,.9)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 10px 24px -8px rgba(79,139,255,1)}
.btn.primary.clean{filter:saturate(.35) opacity(.75);box-shadow:none}
.btn.icon{width:34px;padding:0;justify-content:center}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--hover);border:1px solid var(--border);gap:2px}
.seg button{height:28px;min-width:30px;padding:0 8px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:650;transition:all .18s}
.seg button svg{width:15px;height:15px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.toggle{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2);user-select:none;border:0;background:transparent}
.toggle:hover{background:var(--hover)}
.switch{width:30px;height:18px;border-radius:99px;background:var(--faint);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle.on .switch{background:var(--accent)}
.toggle.on .switch::after{transform:translateX(12px)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1b1f33;color:#fff;font-size:11.5px;font-weight:550;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:60;box-shadow:var(--shadow);letter-spacing:0;text-transform:none}
.menu-wrap.open [data-tip]::after{display:none}

/* ---------- Menus ---------- */
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:270px;max-width:380px;background:var(--elev);border:1px solid var(--border-2);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50;max-height:75vh;overflow:auto}
.menu.left{left:0;right:auto;transform-origin:top left}
.menu-wrap.open .menu{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:13px;text-align:left;color:var(--text-2)}
.mi:hover{background:var(--accent-soft);color:var(--text)}
.mi svg{width:16px;height:16px;color:var(--muted);flex:none}
.mi:hover svg{color:var(--accent)}
.mi kbd{margin-left:auto;font-family:var(--font-ui);font-size:11px;color:var(--muted);background:var(--hover);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.mi .switch{margin-left:auto}
.mi.on .switch{background:var(--accent)}
.mi.on .switch::after{transform:translateX(12px)}
.mh{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:8px 10px 4px;display:flex;align-items:center}
.mh button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;border-radius:5px;padding:2px 6px}
.mh button:hover{color:var(--err);background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.recent-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer}
.recent-item:hover{background:var(--accent-soft)}
.ri-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--hover);color:var(--accent);flex:none}
.ri-ic svg{width:16px;height:16px}
.ri-t{min-width:0;flex:1}
.ri-n{font-size:13px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-x{opacity:0;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:none}
.ri-x svg{width:13px;height:13px}
.recent-item:hover .ri-x{opacity:1}
.ri-x:hover{background:var(--hover);color:var(--err)}
.recent-item.current .ri-ic{background:var(--grad);color:#fff}
.empty-note{padding:16px 10px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}

/* ---------- Path bar ---------- */
.pathbar{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 70%,transparent);min-height:48px;position:relative;z-index:10}
.file-badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;transition:all .25s}
.linked-file .file-badge{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px rgba(124,92,255,.9)}
.file-badge svg{width:17px;height:17px}
.crumbs{display:flex;align-items:center;gap:1px;min-width:0;flex:1;overflow:hidden}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;padding:3px 6px;border-radius:6px;font-family:var(--font-mono);font-size:12.5px}
.crumbs .folder-part{display:flex;align-items:center;gap:1px;min-width:0;overflow:hidden;cursor:pointer;border-radius:7px;padding:2px 0;flex-shrink:1}
.crumbs .folder-part:hover{background:var(--hover)}
.crumbs .folder-part:hover .crumb{color:var(--text)}
.crumb-sep{color:var(--faint);font-size:12px;flex:none}
.crumb.file{color:var(--text);font-weight:700;font-family:var(--font-ui);font-size:14px;display:flex;align-items:center;gap:8px;flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none;flex:none}
.is-dirty .dirty-dot{display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,119,6,.45)}70%{box-shadow:0 0 0 7px rgba(217,119,6,0)}100%{box-shadow:0 0 0 0 rgba(217,119,6,0)}}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:650;border:1px solid var(--border-2);background:var(--panel);color:var(--text-2);cursor:pointer;white-space:nowrap;flex:none;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip svg{width:13px;height:13px}
.chip.warn{border-color:rgba(217,119,6,.45);color:var(--warn);background:rgba(217,119,6,.08)}
.chip.warn.pulse{animation:pulse 2s infinite}
.chip.ok{border-color:rgba(22,163,74,.3);color:var(--ok);background:rgba(22,163,74,.07);cursor:default}
.chip.muted{color:var(--muted);cursor:default}
.chip.muted:hover{border-color:var(--border-2)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip.ghost:hover{color:var(--accent)}
.path-input{flex:1;min-width:200px;height:32px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);color:var(--text);padding:0 10px;font:12.5px var(--font-mono);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.path-actions{display:flex;align-items:center;gap:6px;flex:none}

/* ---------- Workspace ---------- */
.workspace{display:grid;grid-template-columns:var(--split) 12px minmax(0,1fr);min-height:0;padding:12px 14px}
.workspace[data-view="editor"]{grid-template-columns:minmax(0,1fr)}
.workspace[data-view="preview"]{grid-template-columns:minmax(0,1fr)}
.workspace[data-view="editor"] .pane.preview,.workspace[data-view="preview"] .pane.editor,.workspace[data-view="editor"] .splitter,.workspace[data-view="preview"] .splitter{display:none}
.pane{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.pane.preview{animation-delay:.06s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pane-head{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:none;user-select:none;background:var(--panel-2)}
.pane-head .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px rgba(124,92,255,.6)}
.pane-head .ph-meta{font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint);font-size:11.5px}
.pane-head .ph-r{margin-left:auto;display:flex;gap:2px;text-transform:none;letter-spacing:0}
.mini{height:26px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.mini:hover{background:var(--hover);color:var(--text)}
.mini svg{width:14px;height:14px}
.splitter{cursor:col-resize;display:flex;align-items:center;justify-content:center;user-select:none}
.splitter::before{content:"";width:4px;height:46px;border-radius:4px;background:var(--faint);opacity:.55;transition:all .2s}
.splitter:hover::before,.splitter.drag::before{background:var(--grad);opacity:1;height:96px}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing .pane{pointer-events:none}

/* ---------- Editor ---------- */
.ed-scroll{flex:1;overflow:auto;position:relative}
.ed-inner{position:relative;min-height:100%;background:linear-gradient(to right,var(--panel-2) 0,var(--panel-2) calc(var(--gutter) + 6px),var(--border) calc(var(--gutter) + 6px),var(--border) calc(var(--gutter) + 7px),transparent calc(var(--gutter) + 7px))}
.ed-hl,.ed-ta{font-family:var(--font-mono);font-size:var(--ed-size,14px);line-height:1.7;tab-size:4;-moz-tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;padding:16px 22px 40vh calc(var(--gutter) + 22px);margin:0;border:0;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}
.ed-hl{position:relative;counter-reset:ln;color:var(--text);pointer-events:none;min-height:100%}
.ln{position:relative;min-height:1.7em}
.ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:calc(-1 * var(--gutter) - 22px);width:var(--gutter);text-align:right;color:var(--faint);font-size:.82em;user-select:none}
.ln.active::after{content:"";position:absolute;inset:0 -22px 0 calc(-1 * var(--gutter) - 22px + var(--gutter) + 7px);background:var(--active-line);z-index:-1;border-radius:0 4px 4px 0}
.ln.active::before{color:var(--accent);font-weight:700}
.ed-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;outline:none;background:transparent;color:transparent;caret-color:var(--accent);overflow:hidden;z-index:2;-webkit-text-fill-color:transparent}
.ed-ta::selection{background:var(--selection)}
.ed-ta::placeholder{color:var(--faint);-webkit-text-fill-color:var(--faint)}
.ed-hl .t-h{color:var(--t-h)}
.ed-hl .t-hm{color:var(--t-h);opacity:.55}
.ed-hl .t-list{color:var(--t-list)}
.ed-hl .t-code{color:var(--t-code)}
.ed-hl .t-link{color:var(--t-link)}
.ed-hl .t-url{color:var(--t-url);opacity:.8}
.ed-hl .t-quote{color:var(--t-quote);font-style:italic}
.ed-hl .t-b{color:var(--t-b);text-shadow:.35px 0 0 currentColor}
.ed-hl .t-i{color:var(--t-i);font-style:italic}
.ed-hl .t-s{color:var(--muted);text-decoration:line-through}
.ed-hl .t-fence{color:var(--t-fence)}
.ed-hl .t-hr{color:var(--t-hr)}
.ed-hl .t-table{color:var(--t-table)}
.ed-hl .t-html{color:var(--t-html)}
.ed-hl .t-fm{color:var(--muted)}

/* ---------- Preview ---------- */
.pv-scroll{flex:1;overflow:auto;scroll-behavior:auto;position:relative}
.md{max-width:880px;margin:0 auto;padding:30px 44px 40vh;font-size:var(--pv-size,16px);line-height:1.72;color:var(--text-2);word-wrap:break-word}
.md>*:first-child{margin-top:0!important}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{color:var(--text);font-weight:720;line-height:1.28;margin:1.6em 0 .6em;letter-spacing:-.018em;scroll-margin-top:16px;position:relative}
.md h1{font-size:2.15em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h1:first-child{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;border-image:var(--grad) 1;border-bottom:2px solid}
.md h2{font-size:1.6em;padding-bottom:.28em;border-bottom:1px solid var(--border)}
.md h3{font-size:1.28em}
.md h4{font-size:1.08em}
.md h5{font-size:.95em}
.md h6{font-size:.88em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.md .anchor{position:absolute;left:-1.1em;opacity:0;color:var(--accent);text-decoration:none;font-weight:400;padding-right:.3em;-webkit-text-fill-color:var(--accent)}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor{opacity:.7}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table,.md details{margin:0 0 1.05em}
.md a{color:var(--t-link);text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .25s}
.md a:hover{background-size:100% 1.5px}
.md strong{color:var(--text);font-weight:700}
.md em{color:var(--text)}
.md del{color:var(--muted)}
.md mark{background:linear-gradient(transparent 40%,rgba(250,204,21,.5) 40%);color:inherit;padding:0 .1em}
.md ul,.md ol{padding-left:1.6em}
.md li{margin:.28em 0}
.md li::marker{color:var(--accent)}
.md li>ul,.md li>ol{margin:.2em 0}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task input{appearance:none;width:1.05em;height:1.05em;border:1.8px solid var(--faint);border-radius:5px;vertical-align:-.15em;margin:0 .5em 0 0;cursor:pointer;display:inline-grid;place-items:center;transition:all .15s}
.md li.task input:checked{background:var(--grad);border-color:transparent}
.md li.task input:checked::after{content:"";width:.3em;height:.55em;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-.08em) rotate(45deg)}
.md li.task.done{color:var(--muted)}
.md blockquote{margin-left:0;padding:.7em 1.1em;border-left:4px solid var(--quote);background:var(--accent-soft);border-radius:0 10px 10px 0;color:var(--text-2)}
.md blockquote>:last-child{margin-bottom:0}
.md blockquote.callout{--c:#4f8bff;border-left-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.md blockquote.callout .callout-t{font-weight:750;color:var(--c);display:flex;align-items:center;gap:6px;margin-bottom:.3em;font-size:.92em;text-transform:uppercase;letter-spacing:.05em}
.md blockquote.c-tip{--c:#16a34a}.md blockquote.c-important{--c:#7c5cff}.md blockquote.c-warning{--c:#d97706}.md blockquote.c-caution{--c:#dc2626}
.md code{font-family:var(--font-mono);font-size:.86em;background:var(--inline-code);color:var(--t-code);padding:.15em .42em;border-radius:6px;border:1px solid var(--border)}
.md pre{position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:0;overflow:hidden}
.md pre code{display:block;padding:1.05em 1.2em;overflow:auto;background:none;border:0;color:var(--text);font-size:.84em;line-height:1.65;border-radius:0}
.md pre .code-lang{position:absolute;top:0;right:0;font:600 10.5px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px;transition:opacity .15s}
.md pre .code-copy{position:absolute;top:7px;right:7px;opacity:0;border:1px solid var(--border-2);background:var(--elev);color:var(--text-2);border-radius:7px;height:26px;padding:0 8px;font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
.md pre .code-copy svg{width:13px;height:13px}
.md pre:hover .code-copy{opacity:1}
.md pre:hover .code-lang{opacity:0}
.md table{border-collapse:separate;border-spacing:0;width:auto;max-width:100%;display:block;overflow:auto;border:1px solid var(--border-2);border-radius:10px}
.md th,.md td{padding:.55em .95em;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.md th:last-child,.md td:last-child{border-right:0}
.md tr:last-child td{border-bottom:0}
.md th{background:var(--panel-2);color:var(--text);font-weight:700;text-align:left}
.md tbody tr:nth-child(even){background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.md tbody tr:hover{background:var(--accent-soft)}
.md hr{border:0;height:2px;background:var(--grad);opacity:.45;margin:2em 0;border-radius:2px}
.md img{max-width:100%;border-radius:10px;box-shadow:var(--shadow)}
.md kbd{font-family:var(--font-mono);font-size:.8em;padding:.12em .45em;border:1px solid var(--border-2);border-bottom-width:2.5px;border-radius:6px;background:var(--panel-2)}
.md details{border:1px solid var(--border-2);border-radius:10px;padding:.5em 1em}
.md summary{cursor:pointer;font-weight:650;color:var(--text)}
.md .footnotes{font-size:.9em;color:var(--muted)}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-doctag{color:var(--hl-kw)}
.hljs-string,.hljs-regexp,.hljs-template-tag,.hljs-meta .hljs-string{color:var(--hl-str)}
.hljs-comment,.hljs-quote{color:var(--hl-com);font-style:italic}
.hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet{color:var(--hl-num)}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--hl-fn)}
.hljs-type,.hljs-class .hljs-title,.hljs-title.class_,.hljs-meta{color:var(--hl-type)}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-property,.hljs-selector-class,.hljs-selector-id,.hljs-name,.hljs-tag{color:var(--hl-attr)}
.hljs-addition{background:var(--hl-add-bg)}.hljs-deletion{background:var(--hl-del-bg)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}

/* ---------- Status bar ---------- */
.statusbar{display:flex;align-items:center;gap:16px;padding:0 18px;height:30px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border);background:color-mix(in srgb,var(--panel) 70%,transparent);user-select:none}
.statusbar .st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.statusbar .st svg{width:13px;height:13px}
.statusbar b{color:var(--text-2);font-weight:650}
.st-save .led{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.is-dirty .st-save .led{background:var(--warn)}
.progress{width:70px;height:4px;border-radius:4px;background:var(--hover);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--grad);border-radius:4px}

/* ---------- Drop overlay ---------- */
.drop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .2s}
body.dragging .drop{opacity:1}
.drop-card{position:relative;width:min(520px,86vw);padding:48px 36px;border-radius:26px;text-align:center;background:var(--elev);box-shadow:var(--shadow-lg);transform:scale(.94);transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
body.dragging .drop-card{transform:none}
.drop-card::before{content:"";position:absolute;inset:-2px;border-radius:28px;padding:2px;background:conic-gradient(from var(--a,0deg),#7c5cff,#22d3ee,#f472b6,#7c5cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.drop-ic{width:78px;height:78px;margin:0 auto 18px;border-radius:22px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 18px 40px -14px rgba(124,92,255,.9);animation:bob 1.6s ease-in-out infinite}
.drop-ic svg{width:38px;height:38px}
@keyframes bob{50%{transform:translateY(-8px)}}
.drop-card h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.drop-card p{margin:0;color:var(--muted);font-size:13.5px}

/* ---------- Toasts / modal ---------- */
.toasts{position:fixed;bottom:44px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:120;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;min-width:240px;max-width:420px;padding:11px 14px;border-radius:12px;background:var(--elev);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);font-size:13px;color:var(--text);animation:tin .3s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto}
.toast.out{animation:tout .25s ease both}
.toast .ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;background:var(--grad)}
.toast.ok .ti{background:var(--ok)}.toast.warn .ti{background:var(--warn)}.toast.err .ti{background:var(--err)}
.toast .ti svg{width:15px;height:15px}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.modal-bg{position:fixed;inset:0;z-index:110;background:rgba(5,7,15,.45);backdrop-filter:blur(6px);display:none;place-items:center}
.modal-bg.open{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,92vw);background:var(--elev);border:1px solid var(--border-2);border-radius:18px;box-shadow:var(--shadow-lg);padding:22px 24px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.55}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal input{width:100%;height:38px;border-radius:10px;border:1px solid var(--border-2);background:var(--panel);color:var(--text);padding:0 12px;font:13px var(--font-mono);outline:none}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn.outline{border-color:var(--border-2)}
.keys{display:grid;grid-template-columns:1fr auto;gap:8px 18px;font-size:13px;color:var(--text-2)}
.keys kbd{font-family:var(--font-ui);font-size:11.5px;background:var(--hover);border:1px solid var(--border-2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;margin-left:3px}

@media (max-width:1100px){.hide-md{display:none!important}}
@media (max-width:820px){.workspace{grid-template-columns:minmax(0,1fr)!important}.workspace[data-view="split"] .pane.preview,.splitter{display:none}.hide-sm{display:none!important}}
@media print{
  body{background:#fff;overflow:visible}
  body::before,body::after,.topbar,.pathbar,.statusbar,.pane.editor,.splitter,.pane-head,.toasts,.drop,.modal-bg{display:none!important}
  .app,.workspace{display:block;height:auto;padding:0}
  .pane{border:0;box-shadow:none;overflow:visible;display:block!important;animation:none}
  .pv-scroll{overflow:visible}
  .md{max-width:none;padding:0;color:#222}
  .md pre .code-copy,.md pre .code-lang{display:none}
}

/* ================= Utilities ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const icon = id => `<svg><use href="#i-${id}"/></svg>`;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('localStorage', e); } }
};
const timeAgo = t => {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  if (s < 604800) return Math.floor(s / 86400) + ' d ago';
  return new Date(t).toLocaleDateString();
};

/* ================= IndexedDB (file handles) ================= */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('markdown-studio', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('recent', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('kv', 'readonly', s => s.get(k)).catch(() => undefined),
    set: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)).catch(e => console.warn('idb', e)),
    del: k => tx('kv', 'readwrite', s => s.delete(k)).catch(() => {}),
    recentAll: () => tx('recent', 'readonly', s => s.getAll()).catch(() => []),
    recentPut: v => tx('recent', 'readwrite', s => s.put(v)).catch(e => console.warn('idb', e)),
    recentDel: id => tx('recent', 'readwrite', s => s.delete(id)).catch(() => {}),
    recentClear: () => tx('recent', 'readwrite', s => s.clear()).catch(() => {})
  };
})();

/* ================= Editor highlighter ================= */
function hlInline(s) {
  // s is raw text; returns escaped html with spans (character count preserved)
  const parts = s.split(/(`+[^`]*?`+)/g);
  return parts.map((p, i) => {
    if (i % 2) return `<span class="t-code">${esc(p)}</span>`;
    let h = esc(p);
    h = h.replace(/(!?\[)([^\]]*)(\]\()([^)\s]*)((?:\s+"[^)]*)?\))/g, (m, a, b, c, d, e) => `<span class="t-link">${a}${b}${c}</span><span class="t-url">${d}</span><span class="t-link">${e}</span>`)

         .replace(/(^|[^*\w])(\*|_)(?=[^\s*_])([^*_]+?)\2(?![*\w])/g, '$1<span class="t-i">$2$3$2</span>')

function highlight(text) {
  const lines = text.split('\n');
  let fence = null, fm = lines[0] === '---';

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i]; let h, m;

    else if (fence) { h = `<span class="${new RegExp('^\\s*' + fence + '\\s*$').test(l) ? 't-fence' : 't-code'}">${esc(l)}</span>`; if (new RegExp('^\\s*' + fence + '\\s*$').test(l)) fence = null; }

    await loadFile({ name: f.name, text: await f.text(), handle, path, mtime: f.lastModified });
    toast(`Opened <b>${esc(f.name)}</b>`, 'ok');
  } catch (e) { console.error(e); toast('Could not open file: ' + esc(e.message), 'err', 4000); }
}
async function openDialog() {
  if (!(await confirmDiscard('opening another file'))) return;
  if (FS_OK) {
    try {
      const [h] = await window.showOpenFilePicker({ id: 'md-studio', types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd', '.txt'] } }], excludeAcceptAllOption: false });
      await openHandle(h, '');
    } catch (e) { if (e.name !== 'AbortError') toast(esc(e.message), 'err'); }
  } else $('#fileInput').click();
}
$('#fileInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) { await loadFile({ name: f.name, text: await f.text(), mtime: f.lastModified }); toast(`Opened <b>${esc(f.name)}</b> (read-only link)`, 'ok'); }
});
let saving = false;
async function save({ quiet = false } = {}) {
  if (saving) return false;
  if (!state.handle) return saveAs();
  saving = true;
  try {
    if (!(await ensurePerm(!quiet))) { if (!quiet) toast('Write permission was not granted', 'warn'); return false; }
    const text = state.content;
    const w = await state.handle.createWritable(); await w.write(text); await w.close();
    state.saved = text; state.external = false;
    try { state.mtime = (await state.handle.getFile()).lastModified; } catch {}
    updateChrome(); persist();
    if (!quiet) toast(`Saved <b>${esc(state.name)}</b>${state.path ? '<br><span style="color:var(--muted);font-size:12px">' + esc(state.path) + '</span>' : ''}`, 'ok');
    return true;
  } catch (e) { console.error(e); toast('Save failed: ' + esc(e.message), 'err', 5000); return false; }
  finally { saving = false; }
}
async function saveAs() {
  if (!FS_OK) { downloadMd(); state.saved = state.content; updateChrome(); persist(); return true; }
  try {
    const h = await window.showSaveFilePicker({ id: 'md-studio', suggestedName: state.name, types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
    const oldName = state.name;
    state.handle = h; state.name = h.name; state.perm = 'granted';
    if (h.name !== oldName) state.path = pathMap[h.name.toLowerCase()] || (state.path ? folderOf(state.path) + '\\' + h.name : '');
    const ok = await save();
    if (ok) await addRecent();
    return ok;
  } catch (e) { if (e.name !== 'AbortError') toast(esc(e.message), 'err'); return false; }
}
function download(name, data, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const downloadMd = () => download(state.name, state.content, 'text/markdown;charset=utf-8');
async function reloadFromDisk(silent) {
  if (!state.handle) { toast('This document is not linked to a file', 'warn'); return; }
  if (!(await ensurePerm(true))) return;
  if (!silent && isDirty()) {
    const r = await modal(`<h3>Reload from disk?</h3><p>Your unsaved edits to <b>${esc(state.name)}</b> will be replaced by the version on disk.</p>`, [{ label: 'Cancel', value: null }, { label: 'Reload', cls: 'primary', value: 'ok', def: true }]);
    if (r !== 'ok') return;
  }
  const f = await state.handle.getFile(), text = await f.text();
  const et = edScroll.scrollTop, caret = ta.selectionStart;
  state.saved = text; state.mtime = f.lastModified; state.external = false;
  setContent(text, { keepScroll: true }); edScroll.scrollTop = et; ta.setSelectionRange(Math.min(caret, text.length), Math.min(caret, text.length));
  persist(); if (!silent) toast('Reloaded from disk', 'ok');
}
async function checkExternal() {
  if (!state.handle || state.perm !== 'granted' || saving || document.hidden) return;
  try {
    const f = await state.handle.getFile();
    if (f.lastModified > state.mtime + 1) {
      const text = await f.text();
      if (text === state.saved) { state.mtime = f.lastModified; return; }
      if (!isDirty()) { await reloadFromDisk(true); toast('File changed on disk — reloaded', 'info'); }
      else if (!state.external) { state.external = true; updateChrome(); }
    }
  } catch (e) { /* file moved / deleted */ }
}
window.addEventListener('focus', checkExternal);
setInterval(checkExternal, 3000);

/* ================= Drag & drop (whole window) ================= */
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].some(t => t === 'Files' || t === 'text/uri-list');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const dt = e.dataTransfer;
  const uri = (dt.getData('text/uri-list') || '').split(/\r?\n/).find(l => l && !l.startsWith('#')) || '';
  const path = pathFromUri(uri);
  const item = [...dt.items].find(i => i.kind === 'file');
  const handleP = item && item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : null;
  const file = item ? item.getAsFile() : null;
  const nameOk = n => /\.(md|markdown|mdown|mkd|txt)$/i.test(n);
  if (!item) { if (path) toast('Only local files can be dropped here', 'warn'); return; }
  if (!(await confirmDiscard('opening the dropped file'))) return;
  try {
    const h = handleP ? await handleP : null;
    if (h && h.kind === 'file') {
      if (!nameOk(h.name) && !(await modal(`<h3>Open ${esc(h.name)}?</h3><p>This doesn't look like a markdown file. Open it as text anyway?</p>`, [{ label: 'Cancel', value: false }, { label: 'Open', cls: 'primary', value: true, def: true }]))) return;
      await openHandle(h, path);
      if (state.perm !== 'granted') await ensurePerm(true);
      return;
    }
    if (h && h.kind === 'directory') { toast('That is a folder — drop a .md file instead', 'warn'); return; }
    if (file) { await loadFile({ name: file.name, text: await file.text(), path, mtime: file.lastModified }); toast(`Opened <b>${esc(file.name)}</b>`, 'ok'); }
  } catch (err) { console.error(err); toast('Could not open dropped file: ' + esc(err.message), 'err', 4000); }
});
</script>
<script>
"use strict";
/* ================= Menus ================= */
function closeMenus(except) { $$('.menu-wrap.open').forEach(m => m !== except && m.classList.remove('open')); }
document.addEventListener('click', e => { const w = e.target.closest('.menu-wrap'); if (!w) closeMenus(); });
$('#bMore').onclick = () => { const w = $('#moreWrap'); closeMenus(w); w.classList.toggle('open'); };
$('#bRecent').onclick = async () => { const w = $('#recentWrap'); closeMenus(w); if (!w.classList.contains('open')) await renderRecent(); w.classList.toggle('open'); };

async function renderRecent() {
  const list = (await DB.recentAll()).sort((a, b) => b.time - a.time);
  const m = $('#recentMenu');
  if (!list.length) { m.innerHTML = `<div class="mh">Recent files</div><div class="empty-note">No recent files yet.<br>Open or drop a markdown file to get started.</div>`; return; }
  m.innerHTML = `<div class="mh">Recent files<button id="rClear">Clear</button></div>` + list.map(r => `
    <div class="recent-item${r.id === state.recentId ? ' current' : ''}" data-id="${r.id}">
      <span class="ri-ic">${icon(r.handle ? 'file' : 'md')}</span>
      <span class="ri-t"><div class="ri-n">${esc(r.name)}</div><div class="ri-p" title="${esc(r.path || '')}">${esc(r.path ? folderOf(r.path) : (r.handle ? 'Linked file' : 'Local copy'))} · ${timeAgo(r.time)}</div></span>
      <button class="ri-x" data-del="${r.id}" title="Remove from list">${icon('x')}</button>
    </div>`).join('');
}
$('#recentMenu').addEventListener('click', async e => {
  if (e.target.closest('#rClear')) { await DB.recentClear(); renderRecent(); return; }
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); await DB.recentDel(del.dataset.del); renderRecent(); return; }
  const it = e.target.closest('.recent-item'); if (!it) return;
  const r = (await DB.recentAll()).find(x => x.id === it.dataset.id); if (!r) return;
  closeMenus();
  if (r.id === state.recentId) return;
  if (!(await confirmDiscard('switching files'))) return;
  if (r.handle) {
    try {
      let p = await r.handle.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted') p = await r.handle.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') { toast('Access to the file was not granted', 'warn'); return; }
      await openHandle(r.handle, r.path);
    } catch (err) { toast(`Could not open <b>${esc(r.name)}</b> — it may have been moved or deleted.`, 'err', 4000); }
  } else {
    await loadFile({ name: r.name, text: r.content || '', path: r.path });
    toast(`Opened local copy of <b>${esc(r.name)}</b>`, 'info');
  }
});

/* ================= Actions ================= */
async function newFile(text = '', name = 'Untitled.md') {
  if (!(await confirmDiscard('creating a new file'))) return;
  state.name = name; state.path = ''; state.handle = null; state.perm = 'none'; state.saved = text; state.mtime = 0; state.external = false; state.recentId = null;
  DB.del('last'); setContent(text); persist(); ta.focus();
}
async function copyMd() { await navigator.clipboard.writeText(state.content); toast('Markdown copied to clipboard', 'ok'); }
function exportPdf() { const t = document.title; document.title = state.name.replace(/\.[^.]+$/, ''); window.print(); document.title = t; }
function exportHtml() {
  const css = $$('style').map(s => s.textContent).join('\n');
  const html = `<!DOCTYPE html><html lang="en" data-theme="${document.documentElement.dataset.theme}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(state.name)}</title><style>${css}body{overflow:auto}.md{padding-bottom:60px}.code-copy{display:none!important}</style></head><body><article class="md">${pv.innerHTML}</article></body></html>`;
  download(state.name.replace(/\.[^.]+$/, '') + '.html', html, 'text/html;charset=utf-8');
}
const actions = {
  saveAs, reload: () => reloadFromDisk(false), exportHtml, download: downloadMd,
  copyHtml: async () => { await navigator.clipboard.writeText(pv.innerHTML); toast('Rendered HTML copied', 'ok'); },
  autosave: () => { settings.autosave = !settings.autosave; saveSettings(); applyView(); toast(settings.autosave ? 'Auto-save to file enabled' : 'Auto-save disabled', 'info'); },
  fontUp: () => { settings.edSize = Math.min(22, settings.edSize + 1); settings.pvSize = Math.min(24, settings.pvSize + 1); saveSettings(); applyView(); requestAnimationFrame(buildMap); },
  fontDown: () => { settings.edSize = Math.max(11, settings.edSize - 1); settings.pvSize = Math.max(12, settings.pvSize - 1); saveSettings(); applyView(); requestAnimationFrame(buildMap); },
  shortcuts: () => modal(`<h3>Keyboard shortcuts</h3><p>Everything you need for fast everyday editing.</p><div class="keys">
    <span>Save to original file</span><span><kbd>Ctrl</kbd><kbd>S</kbd></span>
    <span>Save as…</span><span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd></span>
    <span>Open file</span><span><kbd>Ctrl</kbd><kbd>O</kbd></span>
    <span>New file</span><span><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>N</kbd></span>
    <span>Bold / Italic / Link / Code</span><span><kbd>Ctrl</kbd><kbd>B</kbd> <kbd>I</kbd> <kbd>K</kbd> <kbd>\`</kbd></span>
    <span>Indent / outdent</span><span><kbd>Tab</kbd> <kbd>Shift</kbd><kbd>Tab</kbd></span>
    <span>Editor · Split · Preview</span><span><kbd>Ctrl</kbd><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span>
    <span>Text size</span><span><kbd>Ctrl</kbd><kbd>=</kbd> <kbd>Ctrl</kbd><kbd>-</kbd></span>
    <span>Export PDF</span><span><kbd>Ctrl</kbd><kbd>P</kbd></span>
    <span>Open a file</span><span>Drag &amp; drop anywhere</span></div>`, [{ label: 'Got it', cls: 'primary' }])
};
$('#moreMenu').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; if (b.dataset.act !== 'autosave') closeMenus(); actions[b.dataset.act]?.(); });
$('#bNew').onclick = () => newFile();
$('#bOpen').onclick = openDialog;
$('#bSave').onclick = () => save();
$('#bCopy').onclick = copyMd; $('#bCopy2').onclick = copyMd;
$('#bPdf').onclick = exportPdf;
$('#bReset').onclick = () => newFile(SAMPLE, 'Markdown syntax guide.md');
$('#bTop').onclick = () => pvScroll.scrollTo({ top: 0, behavior: 'smooth' });
$('#tSync').onclick = () => { settings.sync = !settings.sync; saveSettings(); applyView(); if (settings.sync) syncFrom('ed'); };
$$('#themeSeg button').forEach(b => b.onclick = () => { settings.theme = b.dataset.theme; saveSettings(); applyTheme(); });
$$('#viewSeg button').forEach(b => b.onclick = () => setView(b.dataset.view));
function setView(v) { settings.view = v; saveSettings(); applyView(); if (v !== 'preview') ta.focus(); }

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if ($('#modalBg').classList.contains('open')) return;
  if (e.key === 'Escape') closeMenus();
  if (e.key === 'F1') { e.preventDefault(); actions.shortcuts(); }
  if (!mod) return;
  if (k === 's' && e.shiftKey) { e.preventDefault(); saveAs(); }
  else if (k === 's') { e.preventDefault(); save(); }
  else if (k === 'o') { e.preventDefault(); openDialog(); }
  else if (k === 'n' && e.altKey) { e.preventDefault(); newFile(); }
  else if (k === 'p') { e.preventDefault(); exportPdf(); }
  else if (e.key === '1' || e.key === '2' || e.key === '3') { e.preventDefault(); setView(['editor', 'split', 'preview'][+e.key - 1]); }
  else if (e.key === '=' || e.key === '+') { e.preventDefault(); actions.fontUp(); }
  else if (e.key === '-') { e.preventDefault(); actions.fontDown(); }
});

/* ================= Splitter ================= */
(() => {
  const sp = $('#splitter');
  sp.addEventListener('pointerdown', e => {
    sp.setPointerCapture(e.pointerId); sp.classList.add('drag'); document.body.classList.add('resizing');
    const r = ws.getBoundingClientRect(), pad = 14;
    const move = ev => { settings.split = Math.min(80, Math.max(20, (ev.clientX - r.left - pad) / (r.width - pad * 2) * 100)); ws.style.setProperty('--split', settings.split + '%'); };
    const up = () => { sp.classList.remove('drag'); document.body.classList.remove('resizing'); sp.removeEventListener('pointermove', move); saveSettings(); buildMap(); };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up, { once: true });
  });
  sp.addEventListener('dblclick', () => { settings.split = 50; saveSettings(); applyView(); });
  new ResizeObserver(debounce(buildMap, 150)).observe(pv);
})();

/* ================= Init / restore last session ================= */
(async function init() {
  applyTheme(); applyView();
  const s = LS.get('mdv.session', null);
  if (!s) { state.name = 'Markdown syntax guide.md'; state.saved = SAMPLE; setContent(SAMPLE); updateChrome(); return; }
  Object.assign(state, { name: s.name, path: s.path || '', saved: s.saved ?? s.content, mtime: s.mtime || 0, recentId: s.recentId || null });
  setContent(s.content ?? '', { keepScroll: true });
  const restoreView = () => {
    requestAnimationFrame(() => {
      edScroll.scrollTop = s.edTop || 0; pvScroll.scrollTop = s.pvTop || 0;
      if (s.caret) ta.setSelectionRange(Math.min(s.caret[0], ta.value.length), Math.min(s.caret[1], ta.value.length));
      updateCaret();
    });
  };
  restoreView();
  if (s.hasHandle) {
    const h = await DB.get('last');
    if (h && h.name === s.name) {
      state.handle = h;
      if (await ensurePerm(false)) {
        try {
          const f = await h.getFile(), text = await f.text();
          if (text !== state.saved) {
            if (!isDirty()) { state.saved = text; state.mtime = f.lastModified; setContent(text, { keepScroll: true }); restoreView(); toast(`Restored <b>${esc(s.name)}</b> — updated from disk`, 'info'); }
            else { state.external = true; state.mtime = f.lastModified; toast(`Restored your unsaved edits to <b>${esc(s.name)}</b>`, 'warn', 4000); }
          } else { state.mtime = f.lastModified; toast(`Welcome back — <b>${esc(s.name)}</b> reopened`, 'ok'); }
        } catch { toast(`<b>${esc(s.name)}</b> could not be read — it may have been moved`, 'warn', 4000); }
      } else toast(`Restored <b>${esc(s.name)}</b>. Click <b>Reconnect file</b> to enable saving to disk.`, 'info', 5000);
    }
  } else if (s.t) toast(`Welcome back — restored <b>${esc(s.name)}</b>`, 'ok');
  updateChrome();
})();
</script>
